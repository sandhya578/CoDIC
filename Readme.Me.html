<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>CoDIC Prototype</title>
<meta name="description" content="Clickable prototype of the Consumer Decision Information Center by OmoOba Group of Companies">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>/* CoDIC prototype. Layout: wireframe header bar + light workspace with the page-37 "YOUR ACCOUNT" sidebar.
   Palette is the prompt pack's proposed accessible interpretation (navy / action orange / gold), not an approved brand palette. */
:root {
  color-scheme: light;
  --navy: #142E52; --navy-2: #0D1F3A; --navy-3: #1E3F6B;
  --action: #C45100; --action-h: #A84200;
  --gold: #C99B32; --gold-soft: #F4E8CC;
  --bg: #F6F8FC; --surface: #FFFFFF; --surface-2: #EEF2F8;
  --text: #182230; --text-2: #526176; --border: #D6DEE8; --border-2: #E6EBF2;
  --focus: #2563EB;
  --success: #147D4A; --success-bg: #E6F4EC;
  --warn: #8A5A00; --warn-bg: #FDF3DC;
  --error: #B42318; --error-bg: #FDECEA;
  --info: #1D4F91; --info-bg: #E8F0FB;
  --restricted: #6941C6; --restricted-bg: #F1ECFC;
  --review: #7A4B00; --review-bg: #FFF6DB;
  --font: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Marcellus", "Trajan Pro", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px; --r-sm: 8px;
  --shadow: 0 1px 2px rgba(20, 46, 82, .06), 0 4px 16px rgba(20, 46, 82, .06);
}
* { box-sizing: border-box; }
html { font-size: 16px; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { line-height: 1.25; text-wrap: balance; margin: 0 0 .5rem; }
h1 { font-size: 1.9rem; font-weight: 700; letter-spacing: -.01em; color: var(--navy); }
h2 { font-size: 1.35rem; font-weight: 700; color: var(--navy); }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0 0 .75rem; }
a { color: var(--info); text-underline-offset: 2px; }
a:hover { color: var(--navy); }
body.underline-links a { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
main:focus, h1:focus { outline: none; }
code, .mono { font-family: var(--mono); font-size: .88em; }
code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.muted { color: var(--text-2); }
.small { font-size: .875rem; }
.center { text-align: center; justify-content: center; }
.right { text-align: right; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.skip { position: absolute; left: -999px; top: 0; background: var(--navy); color: #fff; padding: 8px 14px; z-index: 100; }
.skip:focus { left: 8px; top: 8px; }
.container { max-width: 1200px; margin: 0 auto; padding-inline: 24px; }
.section { padding-block: 32px 48px; }
.narrow { max-width: 760px; margin-inline: auto; }
.spacer { flex: 1; }
img { max-width: 100%; }

/* ---------- Prototype strip (reviewer, visually separate) ---------- */
.proto-strip { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 6px 24px; background: repeating-linear-gradient(135deg, #FFF3C4 0 12px, #FDEBA8 12px 24px); color: #4A3500; font-size: .8rem; border-bottom: 1px solid #E5C76B; }
.proto-strip > span { display: inline-flex; align-items: center; gap: 6px; }
.ps-persona { margin-left: auto; }
.ps-btn { font: inherit; font-weight: 700; background: #4A3500; color: #FFF3C4; border: 0; border-radius: 999px; padding: 4px 14px; cursor: pointer; min-height: 28px; }
.ps-btn:hover { background: #2B1F00; }

/* ---------- Header (wireframe bar) ---------- */
.site-header { background: radial-gradient(1200px 300px at 70% -40%, rgba(201, 155, 50, .28), transparent 60%), linear-gradient(100deg, var(--navy-2) 0%, var(--navy) 45%, #29456D 100%); color: #fff; position: relative; }
.site-header::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; pointer-events: none; }
.hdr-inner { position: relative; z-index: 2; max-width: 1360px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; gap: 14px; min-height: 84px; }
.logo { width: 68px; height: 68px; display: block; border-radius: 50%; box-shadow: 0 0 0 2px rgba(201, 155, 50, .55); }
.logo-btn, .pop-btn { background: none; border: 0; padding: 0; color: inherit; font: inherit; cursor: pointer; }
.logo-sm { width: 36px; height: 36px; border-radius: 50%; }
.oursites-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 6px; border-radius: 8px; }
.oursites-btn small { font-size: .6rem; font-weight: 700; letter-spacing: .08em; line-height: 1.1; text-align: center; }
.oursites .pop-btn:hover .oursites-btn { background: rgba(255,255,255,.1); }
.wordmark { display: flex; flex-direction: column; line-height: 1.1; padding-right: 8px; border-right: 1px solid rgba(255,255,255,.2); margin-right: 4px; }
.wordmark span { font-family: var(--display); font-size: 1.35rem; color: #fff; letter-spacing: .02em; }
.wordmark small { font-size: .68rem; color: #E9D6A6; max-width: 170px; }
.main-nav { display: flex; align-items: center; gap: 2px; }
.nav-a { color: #fff; text-decoration: none; font-weight: 600; padding: 8px 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.nav-a:hover, .nav-a.cur { background: rgba(255,255,255,.12); color: #fff; }
.utils { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.util-pill { display: flex; align-items: center; gap: 2px; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.22); border-radius: 999px; padding: 3px 6px; }
.util .pop-btn { display: inline-flex; align-items: center; gap: 4px; color: #fff; padding: 6px 8px; border-radius: 999px; min-height: 36px; }
.util .pop-btn:hover { background: rgba(255,255,255,.14); }
.util-txt { font-weight: 600; font-size: .9rem; font-variant-numeric: tabular-nums; }
.util-sep { width: 1px; height: 28px; background: rgba(255,255,255,.25); }
.acct { position: relative; gap: 8px; }
.dot-badge { position: absolute; top: 0; left: 22px; background: var(--action); color: #fff; font-size: .68rem; font-weight: 700; border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }
.hamburger { display: none; margin-left: auto; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff; border-radius: 10px; width: 46px; height: 46px; place-items: center; cursor: pointer; }
.lang-banner { position: relative; z-index: 2; background: rgba(0,0,0,.25); font-size: .85rem; padding: 6px 24px; display: flex; gap: 8px; align-items: center; color: #F6E7BF; }

/* Popovers */
.pop { position: relative; }
.pop-panel { position: absolute; top: calc(100% + 8px); z-index: 50; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--r); box-shadow: 0 12px 40px rgba(13, 31, 58, .22); padding: 12px; min-width: 240px; max-width: min(92vw, 420px); }
.pop-left { left: 0; } .pop-right { right: 0; }
.pop-title { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-2); margin: 8px 0 6px; }
.pop-title:first-child { margin-top: 0; }
.pop-note { font-size: .78rem; color: var(--text-2); margin: 10px 0 0; }
.menu-list { list-style: none; margin: 0; padding: 0; }
.menu-list li.sep { border-top: 1px solid var(--border-2); margin-top: 6px; padding-top: 6px; }
.menu-list button { width: 100%; text-align: left; background: none; border: 0; font: inherit; color: var(--text); padding: 8px 10px; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; min-height: 40px; justify-content: center; }
.menu-list button:hover { background: var(--surface-2); }
.menu-list small { color: var(--text-2); font-size: .8rem; }
.services-panel { min-width: 520px; }
.svc-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.clock-panel { width: 340px; }
.clock-list { list-style: none; margin: 0; padding: 0; max-height: 330px; overflow: auto; }
.clock-list button { width: 100%; display: flex; justify-content: space-between; gap: 12px; background: none; border: 0; font: inherit; color: var(--text); padding: 7px 8px; border-radius: 8px; cursor: pointer; text-align: left; }
.clock-list button:hover, .clock-list button.on { background: var(--surface-2); }
.clock-list button.on { box-shadow: inset 3px 0 0 var(--action); }
.cl-city, .cl-time { display: flex; flex-direction: column; }
.cl-time { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.clock-list small { font-weight: 400; color: var(--text-2); font-size: .75rem; }
.cal-panel { width: 320px; }
.cal-nav { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.cal-nav strong { flex: 1; text-align: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal-dow { font-size: .72rem; color: var(--text-2); font-weight: 700; padding: 2px 0; }
.cal-day { background: none; border: 1px solid transparent; border-radius: 8px; font: inherit; font-size: .85rem; padding: 6px 0; cursor: pointer; color: var(--text); position: relative; font-variant-numeric: tabular-nums; }
.cal-day:hover { background: var(--surface-2); }
.cal-day.today { border-color: var(--navy); font-weight: 700; }
.cal-day.sel { background: var(--navy); color: #fff; }
.cal-day.has::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--action); }
.cal-day.sel.has::after { background: var(--gold); }
.cal-detail { margin-top: 10px; min-height: 40px; font-size: .88rem; }
.cal-ev { display: flex; flex-direction: column; padding: 6px 8px; background: var(--gold-soft); border-radius: 8px; margin-bottom: 4px; }
.cal-ev span { font-size: .78rem; color: var(--text-2); }
.seg { display: flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { flex: 1; background: var(--surface); border: 0; border-right: 1px solid var(--border); font: inherit; font-size: .82rem; padding: 8px 4px; cursor: pointer; color: var(--text); min-height: 40px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--navy); color: #fff; }
.toggle-row { display: flex; gap: 8px; align-items: center; margin-top: 10px; font-size: .9rem; }
.lang-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
.lang-list button { width: 100%; display: flex; flex-direction: column; text-align: left; background: none; border: 0; font: inherit; color: var(--text); padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.lang-list button:hover, .lang-list button.on { background: var(--surface-2); }
.lang-list button.on { box-shadow: inset 3px 0 0 var(--action); }
.lang-list small { color: var(--text-2); font-size: .74rem; }

/* Drawer (mobile menu) */
.overlay { position: fixed; inset: 0; background: rgba(13, 31, 58, .5); z-index: 80; display: flex; justify-content: center; align-items: flex-start; padding: 24px 16px; overflow: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 92vw); background: var(--surface); color: var(--text); display: flex; flex-direction: column; box-shadow: -10px 0 40px rgba(0,0,0,.25); }
.drawer-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
.drawer-head strong { flex: 1; }
.drawer-body { overflow: auto; padding: 12px 16px 32px; }
.drawer-link { display: block; width: 100%; text-align: left; background: none; border: 0; font: inherit; font-weight: 600; color: var(--text); padding: 10px 8px; border-radius: 8px; cursor: pointer; min-height: 44px; }
.drawer-link:hover { background: var(--surface-2); }
.drawer-utils { display: flex; gap: 6px; flex-wrap: wrap; }
.drawer-utils .pop-btn { color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px; display: inline-flex; gap: 4px; align-items: center; min-height: 40px; }
.drawer-utils .pop-panel { position: fixed; left: 16px; right: 16px; top: 80px; max-width: none; width: auto; }

/* ---------- Footer ---------- */
.site-footer { background: var(--navy-2); color: #CFD8E6; margin-top: 40px; }
.ft-inner { max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: auto 1fr; gap: 16px 32px; align-items: center; }
.ft-brand { display: flex; gap: 12px; align-items: center; }
.ft-brand div { display: flex; flex-direction: column; }
.ft-brand strong { color: #fff; font-family: var(--display); font-size: 1.1rem; font-weight: 400; }
.ft-brand span { font-size: .8rem; color: #E9D6A6; }
.ft-links { display: flex; gap: 6px 20px; flex-wrap: wrap; justify-content: flex-end; }
.ft-links a { color: #fff; text-decoration: none; font-weight: 600; font-size: .92rem; }
.ft-links a:hover { text-decoration: underline; color: #fff; }
.ft-note { grid-column: 1 / -1; font-size: .8rem; margin: 0; color: #A9B6CA; border-top: 1px solid rgba(255,255,255,.12); padding-top: 14px; }

/* ---------- Buttons, badges ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: inherit; font-weight: 700; font-size: .95rem; border-radius: 10px; border: 1px solid transparent; padding: 10px 18px; min-height: 44px; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn-sm { padding: 6px 12px; min-height: 36px; font-size: .86rem; border-radius: 8px; }
.btn-primary, .btn-cta { background: var(--action); color: #fff; }
.btn-primary:hover, .btn-cta:hover { background: var(--action-h); }
.btn-secondary { background: var(--surface); color: var(--navy); border-color: var(--border); }
.btn-secondary:hover { border-color: var(--navy); }
.btn-ghost { background: transparent; color: var(--navy); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-link { background: none; color: var(--info); padding-inline: 0; min-height: 32px; }
.btn-link:hover { color: var(--navy); text-decoration: underline; }
.btn-danger { background: var(--error); color: #fff; }
.btn-danger:hover { background: #8F1B12; }
.btn-restricted { background: var(--restricted); color: #fff; }
.btn-restricted:hover { background: #53329E; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { background: none; border: 0; color: inherit; width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 8px; cursor: pointer; }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn.sm { width: 32px; height: 32px; border: 1px solid var(--border); background: var(--surface); }
.link-btn { background: none; border: 0; padding: 0 2px; font: inherit; color: var(--info); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.badge { display: inline-flex; align-items: center; gap: 4px; font-size: .76rem; font-weight: 700; border-radius: 999px; padding: 3px 10px; line-height: 1.35; white-space: nowrap; }
.badge-neutral { background: var(--surface-2); color: var(--text-2); }
.badge-info { background: var(--info-bg); color: var(--info); }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warn { background: var(--warn-bg); color: var(--warn); }
.badge-error { background: var(--error-bg); color: var(--error); }
.badge-restricted { background: var(--restricted-bg); color: var(--restricted); }
.sample-tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px dashed var(--warn); color: var(--warn); border-radius: 4px; padding: 0 5px; margin-left: 6px; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; font-weight: 700; flex: none; }
.stars { display: inline-flex; gap: 1px; vertical-align: -2px; }
.stars svg { fill: #D6DEE8; }
.stars svg.on { fill: var(--gold); }

/* ---------- Notices, empty states ---------- */
.notice { display: flex; gap: 10px; align-items: flex-start; border-radius: var(--r-sm); padding: 12px 14px; margin: 0 0 16px; font-size: .93rem; border: 1px solid; }
.notice > .ic { flex: none; margin-top: 2px; }
.notice strong { display: block; }
.notice-info { background: var(--info-bg); border-color: #C7D8F2; color: #163E73; }
.notice-success { background: var(--success-bg); border-color: #B9DFC9; color: #0F5C37; }
.notice-warn { background: var(--warn-bg); border-color: #EFD8A3; color: #6B4600; }
.notice-error { background: var(--error-bg); border-color: #F3C2BD; color: #8F1B12; }
.notice-restricted { background: var(--restricted-bg); border-color: #D9CCF6; color: #4C2E92; }
.empty { text-align: center; padding: 40px 20px; background: var(--surface); border: 1px dashed var(--border); border-radius: var(--r); }
.empty-ic { display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 50%; background: var(--surface-2); color: var(--navy); margin-bottom: 10px; }
.empty p { color: var(--text-2); max-width: 520px; margin-inline: auto; }
.rev-hint { display: flex; gap: 8px; align-items: flex-start; margin-top: 14px; padding: 8px 12px; border: 1px dashed #D9B44A; background: var(--review-bg); color: var(--review); border-radius: 8px; font-size: .82rem; }
.rev-hint .ic { flex: none; margin-top: 2px; }
.src-chip { display: inline-block; margin-left: 8px; font-family: var(--mono); font-size: .7rem; font-weight: 500; color: var(--review); background: var(--review-bg); border: 1px dashed #D9B44A; border-radius: 4px; padding: 0 5px; vertical-align: 1px; letter-spacing: 0; text-transform: none; }

/* ---------- Public pages ---------- */
.title-band { text-align: center; padding: 34px 24px 26px; background: linear-gradient(180deg, #FFFFFF, var(--bg)); border-bottom: 1px solid var(--border-2); }
.brand-title { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 3.4vw, 2.4rem); color: var(--action); letter-spacing: .01em; margin: 0; }
.brand-sub { font-family: var(--display); color: var(--navy); font-size: clamp(1.05rem, 2vw, 1.35rem); margin: 6px 0 0; }
.intro-lede { font-size: 1.15rem; max-width: 70ch; color: var(--text); }
.company-list { display: flex; flex-direction: column; gap: 12px; margin-top: 18px; }
.list-row { display: flex; gap: 20px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 22px; }
.lr-text { flex: 1; min-width: 0; }
.lr-text h3 { color: var(--navy); font-size: 1.15rem; }
.lr-text p { margin: 0; color: var(--text-2); }
.offer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
.offer { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); }
.offer-paid { border-top: 4px solid var(--gold); }
.offer:not(.offer-paid) { border-top: 4px solid var(--action); }
.offer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.eyebrow { font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--action); }
.offer-list { margin: 0; padding: 0; list-style: none; counter-reset: o; }
.offer-list li { counter-increment: o; border-top: 1px solid var(--border-2); }
.offer-list button { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; font: inherit; font-weight: 600; color: var(--text); padding: 12px 4px; cursor: pointer; text-align: left; min-height: 44px; }
.offer-list button::before { content: counter(o); width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); color: var(--navy); display: grid; place-items: center; font-size: .78rem; flex: none; }
.offer-list button span { flex: 1; }
.offer-list button:hover { color: var(--action); }
.prose { max-width: 78ch; }
.prose h2 { margin-top: 18px; }
.prose h3 { margin-top: 16px; color: var(--navy); }
.def-list dt { font-weight: 700; color: var(--navy); margin-top: 10px; }
.def-list dd { margin: 2px 0 0; color: var(--text); }
.about-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 20px 0; }
.about-trio > div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
.about-trio h3 { color: var(--navy); }
.about-trio p { margin: 0; color: var(--text-2); }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 40px; align-items: start; }
.pillars { list-style: none; margin: 0; padding: 22px; background: var(--navy); color: #fff; border-radius: var(--r); display: flex; flex-direction: column; gap: 16px; position: sticky; top: 16px; }
.pillars li { display: flex; align-items: center; gap: 12px; font-family: var(--display); font-size: 1.25rem; letter-spacing: .12em; text-transform: uppercase; }
.pillar-ic { width: 38px; height: 38px; border-radius: 10px; background: rgba(201, 155, 50, .2); color: var(--gold); display: grid; place-items: center; }
.cat-mini { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.cat-chip { display: inline-flex; gap: 6px; align-items: center; font: inherit; font-size: .88rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; cursor: pointer; color: var(--navy); min-height: 36px; }
.cat-chip:hover { border-color: var(--navy); }
.apply-box { background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--gold); border-radius: var(--r); padding: 16px 18px; margin: 20px 0 12px; }
.variants { font-size: .9rem; margin-top: 8px; }
.variants summary { cursor: pointer; color: var(--info); font-weight: 600; }
.policy-list { display: grid; gap: 10px; }
.policy-item { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; }
.policy-item p { margin: 0; }
.faq details { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 16px; margin-bottom: 8px; }
.faq summary { font-weight: 700; cursor: pointer; color: var(--navy); }
.faq p { margin: 8px 0 0; }

/* ---------- Auth ---------- */
.auth-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px; box-shadow: var(--shadow); margin-bottom: 18px; }
.form-card { padding: 26px; }
.center-card { text-align: center; }
.center-card .notice { text-align: left; }
.card-title { font-size: 1.1rem; margin-bottom: 12px; }
.auth-card .page-head { margin-bottom: 8px; }
.tab-body { padding-top: 18px; }
.auth-foot { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-2); font-size: .92rem; }
.auth-aside { background: var(--surface); border: 1px dashed #D9B44A; border-radius: var(--r); padding: 18px; }
.auth-aside h2 { font-size: 1rem; color: var(--review); }
.demo-accts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.demo-accts li { display: flex; flex-direction: column; font-size: .85rem; border-top: 1px solid var(--border-2); padding-top: 8px; }
.demo-accts li span { color: var(--text-2); font-size: .78rem; }
.demo-accts code { font-size: .78rem; background: none; padding: 0; }
.otp-input { font-family: var(--mono); font-size: 1.5rem; letter-spacing: .4em; max-width: 240px; text-align: center; }
.big-check { display: inline-grid; place-items: center; width: 60px; height: 60px; border-radius: 50%; background: var(--success-bg); color: var(--success); margin-bottom: 10px; }
.big-check.restricted { background: var(--restricted-bg); color: var(--restricted); }
.type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 20px 0; }
.type-card { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; font: inherit; color: var(--text); cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.type-card:hover { border-color: var(--action); transform: translateY(-2px); }
.type-card strong { font-size: 1.15rem; color: var(--navy); }
.type-card > span:not(.type-ic):not(.type-go) { color: var(--text-2); font-size: .92rem; flex: 1; }
.type-ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--gold-soft); color: var(--navy); }
.type-go { display: inline-flex; align-items: center; gap: 4px; color: var(--action); font-weight: 700; font-size: .9rem; }

/* ---------- Forms ---------- */
.page-head { margin-bottom: 20px; }
.page-head-row { display: flex; gap: 16px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
.page-head-row > div:first-child { min-width: 0; flex: 1; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.lede { color: var(--text-2); max-width: 75ch; }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: .85rem; margin-bottom: 8px; color: var(--text-2); }
.crumbs > span { display: inline-flex; align-items: center; gap: 4px; }
.field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 22px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; margin: 0; border: 0; padding: 0; }
.field.wide, fieldset.field, .field.consent { grid-column: 1 / -1; }
.lbl { font-weight: 700; font-size: .92rem; color: var(--text); padding: 0; }
.req { color: var(--error); }
.opt { color: var(--text-2); font-weight: 400; font-size: .85rem; }
input[type=text], input[type=email], input[type=tel], input[type=url], input[type=number], input[type=date], input[type=password], input:not([type]), select, textarea {
  font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; width: 100%; }
textarea { resize: vertical; min-height: 110px; }
input:hover, select:hover, textarea:hover { border-color: #B8C4D4; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
[aria-invalid=true] { border-color: var(--error) !important; background: #FFFBFA; }
.hint { font-size: .82rem; color: var(--text-2); margin: 0; }
.err { display: flex; gap: 6px; align-items: center; color: var(--error); font-size: .85rem; font-weight: 600; margin: 0; }
.has-err .lbl { color: var(--error); }
.radios { display: flex; flex-wrap: wrap; gap: 8px; }
.radio { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 14px; cursor: pointer; background: var(--surface); min-height: 44px; font-weight: 500; }
.radio:hover { border-color: var(--navy); }
.radio.on { border-color: var(--navy); background: var(--info-bg); box-shadow: inset 0 0 0 1px var(--navy); }
.radio input { accent-color: var(--navy); width: 16px; height: 16px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; cursor: pointer; background: #FBF8F1; font-size: .9rem; min-height: 38px; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip:focus-within { outline: 3px solid var(--focus); outline-offset: 1px; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.star-input { display: flex; align-items: center; gap: 4px; }
.star-input button { background: none; border: 0; padding: 4px; cursor: pointer; border-radius: 6px; min-width: 40px; min-height: 40px; }
.star-input svg { fill: #D6DEE8; }
.star-input button.on svg { fill: var(--gold); }
.star-val { margin-left: 8px; font-weight: 600; color: var(--text-2); }
.consent-box { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; }
.consent-box input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--navy); flex: none; }
.consent-box > span { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.consent-text { font-size: .9rem; color: var(--text-2); }
.consent-box.has-err { border-color: var(--error); }
.sig { position: relative; }
.sig-preview { display: block; font-family: "Brush Script MT", "Segoe Script", cursive; font-size: 1.5rem; color: var(--navy); border-bottom: 1px solid var(--border); padding: 4px 4px 0; margin-top: 4px; }
.sig-preview.inline { display: inline; border: 0; font-size: 1.25rem; }
.pw { display: flex; gap: 8px; align-items: center; }
.pw input { flex: 1; }
.readonly { background: var(--surface-2); border: 1px dashed var(--border); border-radius: var(--r-sm); padding: 10px 12px; color: var(--text-2); font-size: .92rem; margin: 0; }
.ta-wrap { position: relative; }
.dict-btn { position: absolute; right: 8px; bottom: 8px; display: inline-flex; gap: 4px; align-items: center; font: inherit; font-size: .8rem; font-weight: 600; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; cursor: pointer; color: var(--navy); }
.dict-btn:hover { border-color: var(--navy); }
.uploader .drop { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border: 2px dashed var(--border); border-radius: var(--r-sm); padding: 14px; background: #FBFCFE; color: var(--text-2); }
.uploader.invalid .drop { border-color: var(--error); }
.file-row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border-2); border-radius: 8px; margin-top: 6px; font-size: .9rem; background: var(--surface); flex-wrap: wrap; }
.file-row > span:nth-child(2) { flex: 1; min-width: 120px; word-break: break-all; }
.file-failed { border-color: #F3C2BD; background: var(--error-bg); color: var(--error); }
.progress { flex: 1; height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; min-width: 80px; }
.progress span { display: block; height: 100%; background: var(--action); transition: width .15s; }
.form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-2); }
.err-summary { border: 2px solid var(--error); background: var(--error-bg); border-radius: var(--r-sm); padding: 12px 16px; margin-bottom: 18px; }
.err-summary:focus { outline: 3px solid var(--focus); }
.err-summary strong { color: var(--error); }
.err-summary ul { margin: 6px 0 0; padding-left: 18px; font-size: .9rem; }
.err-summary a { color: var(--error); }
.wizard { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 24px; align-items: start; }
.stepper { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 16px; }
.stepper li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; color: var(--text-2); font-size: .92rem; }
.stepper li.cur { background: var(--surface); color: var(--navy); font-weight: 700; box-shadow: var(--shadow); }
.stepper li.done { color: var(--text); }
.stepper .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: .78rem; font-weight: 700; flex: none; }
.stepper li.cur .dot { background: var(--action); color: #fff; }
.stepper li.done .dot { background: var(--success); color: #fff; }
.step-title { margin-bottom: 16px; }
.acct-type-row { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; margin-bottom: 18px; border-bottom: 1px solid var(--border-2); }
.acct-type { background: var(--gold-soft); color: var(--navy); font-weight: 700; padding: 4px 12px; border-radius: 999px; }
.review-sec { border: 1px solid var(--border-2); border-radius: var(--r-sm); padding: 14px 16px; margin-bottom: 12px; }
.review-head { display: flex; justify-content: space-between; align-items: center; }
.review dl, .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 20px; margin: 8px 0 12px; }
.review dl > div, .kv > div { min-width: 0; }
.review dt, .kv dt { font-size: .78rem; font-weight: 700; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.review dd, .kv dd { margin: 0; overflow-wrap: anywhere; }
.compose-meta { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--border-2); }
.confidential { border-top: 4px solid var(--restricted); }
.picker { margin-top: 10px; position: relative; }
.picked { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.pick-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--restricted-bg); color: var(--restricted); border-radius: 999px; padding: 4px 6px 4px 12px; font-weight: 600; font-size: .88rem; }
.pick-chip button { background: none; border: 0; color: inherit; cursor: pointer; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; }
.pick-chip button:hover { background: rgba(105, 65, 198, .15); }
.picker-list { list-style: none; margin: 4px 0 0; padding: 4px; border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface); box-shadow: var(--shadow); }
.picker-list.static { box-shadow: none; margin-top: 8px; }
.picker-list button { display: flex; gap: 8px; align-items: center; width: 100%; background: none; border: 0; font: inherit; padding: 8px; border-radius: 6px; cursor: pointer; text-align: left; min-height: 40px; }
.picker-list button:hover { background: var(--surface-2); }
.picker-list small { margin-left: auto; color: var(--text-2); }
.auto-fed { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 18px; }

/* ---------- Workspace ---------- */
.workspace { max-width: 1320px; margin: 0 auto; padding: 24px; display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 28px; align-items: start; }
.side { background: #FBF8F1; border: 1px solid #EDE3CC; border-radius: var(--r); padding: 16px 10px; position: sticky; top: 16px; }
.side-title { font-size: .74rem; font-weight: 700; letter-spacing: .1em; color: var(--text-2); padding: 0 10px 10px; }
.side-user { display: flex; gap: 10px; align-items: center; padding: 8px 10px 14px; border-bottom: 1px solid #EDE3CC; margin-bottom: 8px; }
.side-user div { display: flex; flex-direction: column; min-width: 0; }
.side-user strong { font-size: .92rem; overflow-wrap: anywhere; }
.side-user small { color: var(--text-2); font-size: .78rem; }
.side-nav { display: flex; flex-direction: column; gap: 2px; }
.side-nav a { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 600; font-size: .95rem; min-height: 44px; }
.side-nav a:hover { background: rgba(20, 46, 82, .06); }
.side-nav a.on { background: var(--surface); color: var(--navy); box-shadow: var(--shadow); }
.side-nav a.on .ic { color: var(--action); }
.side-nav .count { margin-left: auto; background: var(--action); color: #fff; font-size: .72rem; border-radius: 999px; padding: 1px 7px; }
.ws-main { min-width: 0; }
.guest-wrap { min-height: 50vh; }

/* Dashboard tiles (page 37) */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-bottom: 30px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.tile::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--navy); }
.tile-whistleblower::before { background: var(--restricted); }
.tile-complaint::before { background: var(--action); }
.tile-review::before, .tile-directory::before { background: var(--gold); }
.tile-scam::before { background: var(--error); }
.tile-trending { border-style: dashed; }
.tile-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tile-head h2 { font-size: 1.08rem; margin: 0; flex: 1; min-width: 120px; }
.tile-ic { width: 40px; height: 40px; border-radius: 10px; background: var(--surface-2); color: var(--navy); display: grid; place-items: center; flex: none; }
.tile-whistleblower .tile-ic { background: var(--restricted-bg); color: var(--restricted); }
.tile p { color: var(--text-2); font-size: .92rem; margin: 0; flex: 1; }
.tile-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.section-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 24px 0 12px; flex-wrap: wrap; }
.section-head h2 { margin: 0; }

/* Feed */
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; margin-bottom: 16px; }
.filter-bar select { width: auto; min-width: 180px; }
.search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px; border: 1px solid var(--border); border-radius: var(--r-sm); padding: 0 10px; background: var(--surface); }
.search input { border: 0; padding: 8px 0; min-height: 40px; }
.search input:focus-visible { outline: none; }
.search:focus-within { outline: 3px solid var(--focus); }
.chip-filter { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { font: inherit; font-size: .85rem; font-weight: 600; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; min-height: 34px; color: var(--text); }
.fchip.on { background: var(--navy); color: #fff; border-color: var(--navy); }
.post-list { display: flex; flex-direction: column; gap: 14px; }
.post-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); }
.pc-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; }
.pc-title { font-size: 1.12rem; margin: 4px 0 8px; }
.pc-title a { color: var(--navy); text-decoration: none; }
.pc-title a:hover { text-decoration: underline; }
.byline { display: flex; align-items: center; gap: 8px; font-size: .9rem; margin-bottom: 8px; flex-wrap: wrap; }
.byline a { font-weight: 700; color: var(--text); }
.byline small { color: var(--text-2); }
.as-group { color: var(--text-2); }
.as-group strong { color: var(--navy); }
.pc-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .84rem; color: var(--text-2); margin-bottom: 8px; }
.pc-meta span { display: inline-flex; align-items: center; gap: 5px; }
.pc-excerpt { margin: 0; color: var(--text); }
.pc-foot { margin-top: 6px; }
.cat-badge { display: inline-flex; align-items: center; gap: 5px; font-size: .78rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: #EAF1EA; color: #1F5C2E; }
.cat-scam { background: var(--error-bg); color: var(--error); }
.cat-breaking { background: #FFF0E5; color: #8C3A00; }
.cat-complaint { background: #FFF0E5; color: var(--action-h); }
.cat-review { background: var(--gold-soft); color: #6B4E00; }
.cat-whistleblower { background: var(--restricted-bg); color: var(--restricted); }
.cat-trending { background: var(--info-bg); color: var(--info); }

/* Post detail */
.post-detail { padding: 24px; }
.detail-stars { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 12px; font-weight: 600; }
.post-body { font-size: 1.02rem; max-width: 75ch; }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 14px 0; }
.media-ph { margin: 0; aspect-ratio: 4 / 3; max-width: 100%; border-radius: var(--r-sm); background: repeating-linear-gradient(45deg, var(--surface-2) 0 10px, #E5EBF3 10px 20px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--text-2); font-size: .8rem; text-align: center; padding: 8px; }
.read-aloud { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 12px; margin: 6px 0 10px; }
.proposed { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 0; border-top: 1px solid var(--border-2); margin-top: 12px; }
.proposed button { font: inherit; font-size: .82rem; border: 1px dashed var(--border); background: var(--surface); border-radius: 999px; padding: 4px 10px; color: var(--text-2); }
.share { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 0 0; border-top: 1px solid var(--border-2); }
.share-url { font-size: .78rem; overflow-wrap: anywhere; }
.share-chip { font: inherit; font-size: .8rem; border: 1px dashed var(--border); border-radius: 999px; background: var(--surface); color: var(--text-2); padding: 3px 10px; }
.ai-panel { background: linear-gradient(180deg, #F6F3FE, var(--surface)); border: 1px solid #DCD2F7; border-radius: var(--r); padding: 16px 20px; margin-bottom: 18px; }
.ai-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.ai-mark { display: inline-flex; gap: 4px; align-items: center; background: #4C3AA8; color: #fff; font-weight: 700; font-size: .78rem; padding: 2px 8px; border-radius: 6px; }
.replies { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
.reply { border-left: 3px solid var(--border); padding: 6px 0 6px 14px; margin: 10px 0; }
.reply.nested { margin-left: 20px; border-left-color: var(--gold); }
.reply-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .9rem; }
.reply p { margin: 6px 0; }
.reply-box { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border-2); display: flex; flex-direction: column; gap: 6px; }

/* Case, tables */
.case-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.timeline { list-style: none; margin: 0 0 10px; padding: 0 0 0 18px; border-left: 2px solid var(--border); }
.timeline li { position: relative; padding: 0 0 14px 10px; display: flex; flex-direction: column; }
.timeline li::before { content: ""; position: absolute; left: -25px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--navy); border: 2px solid var(--surface); }
.timeline li.todo::before { background: var(--surface); border-color: var(--border); }
.timeline li.todo strong { color: var(--text-2); font-weight: 600; }
